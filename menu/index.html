<!-- ===================================================================
     SETUP — the only part you need to edit.

     1. WA_NUMBER
        Your WhatsApp Business number in full international form, digits
        only, no + and no spaces.  e.g. 2348012345678

     2. The four SHEET urls
        In Google Sheets: File -> Share -> Publish to web.
        Publish EACH TAB ON ITS OWN, as "Comma-separated values (.csv)".

        DO NOT publish "Entire Document". Your Ops and Riders tabs hold
        staff phone numbers, and publishing the whole file would put them
        on the open web. Publish only the four tabs listed below.

        Paste the URL Google gives you for each one.
     =================================================================== -->
<script>
const CONFIG = {
  WA_NUMBER: "2347053594258",

  SHEETS: {
    services:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=2002841459&single=true&output=csv",
    zones:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=1239200434&single=true&output=csv",
    restaurants: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=350484638&single=true&output=csv",
    menu:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=1751665817&single=true&output=csv"
  },

  BUSINESS: "Owa Delivery",
  CURRENCY: "\u20A6",

  // How long to trust the copy saved on the phone before refetching.
  // The page still works offline past this; it just tries the network first.
  CACHE_MINUTES: 30
};
</script>

<body>
<header class="top">
  <div class="wrap">
    <a class="home" href="/index.html" aria-label="Owa Delivery home">
      <img src="/assets/owa-logo.png" alt="" width="38" height="38" onerror="this.remove()">
      <span class="mark">Owa Delivery</span>
    </a>
    <div class="top-meta"><b>Order locally.</b> Choose your service and area to see matching vendors.</div>
  </div>
</header>

<nav class="wrap trail" id="trail" hidden aria-label="Your choices so far"></nav>

<main class="wrap" id="main">
  <div class="state" id="boot">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>

<div class="docket" id="docket" hidden>
  <div class="wrap">
    <div class="tot">
      <span class="lab"><b id="dLines">Nothing yet</b>Delivery is added in the chat</span>
      <span class="amt" id="dTotal" aria-live="polite">&#8358;0</span>
    </div>
    <a class="send" id="send" aria-disabled="true" role="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.6 14.1c-.2.6-1.2 1.2-1.7 1.2-.4 0-1 .1-3.2-.8-2.7-1.2-4.4-4-4.5-4.2-.1-.2-1-1.4-1-2.6s.6-1.8.9-2c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.5-.3.3c-.1.1-.2.3 0 .5.2.4.8 1.3 1.6 2 1.1.9 1.9 1.2 2.1 1.3.2.1.4.1.5-.1l.8-.9c.2-.2.3-.2.5-.1l2 1c.2.1.4.2.4.3.1.1.1.6-.1 1.2Z"/></svg>
      <span id="sendLabel">Add something first</span>

<script>
"use strict";

/* ---------- tiny helpers ---------- */
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag);
  if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const money = (n) => CONFIG.CURRENCY + Math.round(Number(n) || 0).toLocaleString("en-NG");
const norm = (v) => String(v == null ? "" : v).trim();
const low  = (v) => norm(v).toLowerCase();
const on   = (r) => String(r && r.active != null ? r.active : "TRUE").toUpperCase() !== "FALSE";

/* ---------- CSV ----------
   Written out rather than pulled from a library: one fewer network request
   on a slow connection, and menu rows genuinely contain commas
   ("Rice, Beans and Plantain") and the odd quoted field. */
function parseCSV(text){
  const rows = []; let row = [], val = "", q = false;
  const s = String(text).replace(/\r\n?/g, "\n");
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){
      if (c === '"'){ if (s[i+1] === '"'){ val += '"'; i++; } else q = false; }
      else val += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(val); val = ""; }
    else if (c === "\n"){ row.push(val); rows.push(row); row = []; val = ""; }
    else val += c;
  }
  if (val !== "" || row.length){ row.push(val); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => norm(h).toLowerCase().replace(/\s+/g, "_"));
  return rows
    .filter(r => r.some(c => norm(c) !== ""))
    .map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = norm(r[i]); }); return o; });
}

/* ---------- data ---------- */
const CACHE_KEY = "owa.menu.v2";
let DATA = null;

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    return c && c.data ? c : null;
  }catch(e){ return null; }
}
function writeCache(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), data })); }
  catch(e){ /* private mode, or full. The page works without it. */ }
}

async function fetchAll(){
  const keys = Object.keys(CONFIG.SHEETS);
  const texts = await Promise.all(keys.map(async k => {
    const url = CONFIG.SHEETS[k];
    if (!/^https:\/\//i.test(url)) throw new Error("unset:" + k);
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("http:" + k + ":" + r.status);
    return r.text();
  }));
  const out = {};
  keys.forEach((k, i) => { out[k] = parseCSV(texts[i]); });
  return out;
}

async function load(){
  const cached = readCache();
  const fresh = cached && (Date.now() - cached.at) < CONFIG.CACHE_MINUTES * 60000;
  if (fresh){ DATA = cached.data; return; }
  try{
    DATA = await fetchAll();
    writeCache(DATA);
  }catch(err){
    if (cached){ DATA = cached.data; return; }   // offline, but we have yesterday's
    throw err;
  }
}

/* ---------- state ---------- */
const S = { service:null, zone:null, vendor:null, packs:1, qty:Object.create(null) };

const services = () => (DATA.services || []).filter(on);
const zones    = () => (DATA.zones || []).filter(on);

function splitValues(value){
  return norm(value).split(/[,;|]/).map(v => low(v).trim()).filter(Boolean);
}
function firstField(row, keys){
  for (const key of keys) if (norm(row && row[key])) return row[key];
  return "";
}
function matchesId(row, keys, wanted){
  const vals = splitValues(firstField(row, keys));
  if (!vals.length) return false;
  if (vals.includes("*") || vals.includes("all")) return true;
  return vals.includes(low(wanted));
}
function servesZone(v){
  return !!S.zone && matchesId(v, ["zone_ids","zone_id","zones","service_zones"], S.zone.zone_id);
}
function servesService(v){
  return !!S.service && matchesId(v, ["service_ids","service_id","service_type","service"], S.service.service_id);
}
const vendors = () => (DATA.restaurants || []).filter(v => on(v) && servesZone(v) && servesService(v));
const items = () => (DATA.menu || []).filter(m => on(m) && S.vendor && low(m.restaurant_id) === low(S.vendor.restaurant_id));
const hasPacks = () => String((S.service && S.service.has_packs) != null ? S.service.has_packs : "TRUE").toUpperCase() !== "FALSE";
const itemWord = () => norm(S.service && S.service.item_label_plural) || "items";
const packWord = n => { const one=norm(S.service && S.service.pack_label)||"pack"; const many=norm(S.service && S.service.pack_label_plural)||one+"s"; return n===1?one:many; };
const lines = () => items().filter(m => S.qty[m.item_id] > 0).map(m => ({id:m.item_id,name:m.item_name,price:Number(m.price)||0,qty:S.qty[m.item_id]}));
const total = () => lines().reduce((s,l) => s+l.price*l.qty,0) * (hasPacks()?S.packs:1);

function render(){
  const main = $("main");
  main.innerHTML = "";
  renderTrail();

  if (!S.service && services().length > 1) return pick(
    "What do you need?", "",
    services().map(s => ({
      name: s.service_name || s.service_id,
      sub: s.service_tagline,
      go: () => { S.service = s; render(); }
    })));

  if (!S.service && services().length === 1) S.service = services()[0];

  if (!S.zone) return pick(
    "Where are we delivering?", "Pick the area closest to you.",
    zones().map(z => ({
      name: z.zone_name || z.zone_id,
      go: () => { S.zone = z; render(); }
    })), "No areas are set up yet.");

  if (!S.vendor){
    const vs = vendors();
    const word = norm(S.service && S.service.vendor_label_plural)
      || (norm(S.service && S.service.vendor_label) ? norm(S.service.vendor_label) + "s" : "vendors");
    return pick(
      "Choose a " + (norm(S.service && S.service.vendor_label) || "vendor"),
      "Showing vendors that match this service and delivery area.",
      vs.map(v => ({ name: v.restaurant_name || v.restaurant_id,
                     sub: v.restaurant_address,
                     go: () => { S.vendor = v; S.qty = Object.create(null); render(); } })),
      "No " + word + " are open in " + (S.zone.zone_name || S.zone.zone_id) +
      " right now. Try another area.");
  }

  renderMenu();
  renderDocket();
}

function renderTrail(){
  const t = $("trail"); t.innerHTML = "";
  const crumbs = [];
  if (S.service && services().length > 1)
    crumbs.push([S.service.service_name || S.service.service_id,
      () => { S.service = null; S.zone = null; S.vendor = null; S.qty = Object.create(null); render(); }]);
  if (S.zone) crumbs.push([S.zone.zone_name || S.zone.zone_id,
    () => { S.zone = null; S.vendor = null; S.qty = Object.create(null); render(); }]);
  if (S.vendor) crumbs.push([S.vendor.restaurant_name || S.vendor.restaurant_id,
    () => { S.vendor = null; S.qty = Object.create(null); render(); }]);

  t.hidden = crumbs.length === 0;
  crumbs.forEach(([label, go], i) => {
    if (i) { const sep = el("span", null, "›"); sep.setAttribute("aria-hidden", "true"); t.append(sep); }
    const b = el("button", null, label);
    b.type = "button";
    b.addEventListener("click", go);
    t.append(b);
  });
}

function pick(title, lede, options, emptyMsg){
  $("docket").hidden = true;
  const sec = el("section", "step");
  sec.append(el("h2", null, title));
  if (lede) sec.append(el("p", "lede", lede));

  if (!options.length){
    const s = el("div", "state");
    s.append(el("h2", null, "Nothing here yet"));
    s.append(el("p", null, emptyMsg || "Please try again shortly."));
    sec.append(s);
    $("main").append(sec);
    return;
  }

  const ul = el("ul", "choices");
  options.forEach(o => {
    const li = el("li");
    const b = el("button"); b.type = "button";
    const name = el("span", "name"); name.append(document.createTextNode(o.name));
    if (o.sub) name.append(el("span", "sub", o.sub));
    const go = el("span", "go", "›"); go.setAttribute("aria-hidden", "true");
    b.append(name, go);
    b.addEventListener("click", o.go);
    li.append(b); ul.append(li);
  });
  sec.append(ul);
  $("main").append(sec);
}

function renderMenu(){
  const list = items();
  const sec = el("section", "step");
  sec.append(el("h2", null, S.vendor.restaurant_name || S.vendor.restaurant_id));
  sec.append(el("p", "lede", list.length
    ? "Tap + to add. Your total updates as you go."
    : "This menu is empty at the moment."));
  const info = el("div", "info-bar");
  info.append(el("span", "info", S.service.service_name || S.service.service_id));
  info.append(el("span", "info", S.zone.zone_name || S.zone.zone_id));
  sec.append(info);

  const groups = new Map();
  list.forEach(m => {
    const k = norm(m.category) || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  });

  groups.forEach((rows, cat) => {
    if (cat) sec.append(el("h3", "cat", cat));
    const ul = el("ul", "pad");
    rows.forEach(m => ul.append(itemRow(m)));
    sec.append(ul);
  });

  if (hasPacks() && list.length){
    const box = el("div", "packs");
    const txt = el("p");
    txt.append(el("strong", null, "How many " + packWord(2) + "?"));
    txt.append(document.createTextNode("The whole order, repeated."));
    const st = el("div", "stepper");
    const less = el("button", "less", "\u2212"); less.type = "button";
    less.setAttribute("aria-label", "One fewer " + packWord(1));
    const q = el("span", "qty", String(S.packs));
    const more = el("button", "add", "+"); more.type = "button";
    more.setAttribute("aria-label", "One more " + packWord(1));
    less.disabled = S.packs <= 1;
    less.addEventListener("click", () => { S.packs = Math.max(1, S.packs - 1); render(); });
    more.addEventListener("click", () => { S.packs = Math.min(20, S.packs + 1); render(); });
    st.append(less, q, more);
    box.append(txt, st);
    sec.append(box);
  }

  $("main").append(sec);
}

function itemRow(m){
  const qty = S.qty[m.item_id] || 0;
  const li = el("li", "row" + (qty ? " in" : ""));

  const line = el("div", "line");
  const item = el("div", "item");
  item.append(el("span", "n", m.item_name || m.item_id));
  line.append(item);
  line.append(el("span", "leader"));
  line.append(el("span", "price", money(m.price)));

  const st = el("div", "stepper");
  const less = el("button", "less", "\u2212"); less.type = "button";
  less.setAttribute("aria-label", "Remove one " + (m.item_name || "item"));
  less.disabled = qty === 0;
  const q = el("span", "qty", String(qty));
  q.dataset.zero = qty === 0 ? "1" : "0";
  q.setAttribute("aria-live", "polite");
  const more = el("button", "add", "+"); more.type = "button";
  more.setAttribute("aria-label", "Add one " + (m.item_name || "item"));

  less.addEventListener("click", () => bump(m.item_id, -1));
  more.addEventListener("click", () => bump(m.item_id, +1));
  st.append(less, q, more);

  li.append(line, st);
  return li;
}

/* Only the touched row and the docket are redrawn, so the page never jumps
   under the thumb mid-order. */
function bump(id, by){
  const next = Math.max(0, Math.min(20, (S.qty[id] || 0) + by));
  if (next === 0) delete S.qty[id]; else S.qty[id] = next;

  const rows = document.querySelectorAll(".pad .row");
  const list = items();
  rows.forEach((row, i) => {
    const m = list[i];
    if (!m || m.item_id !== id) return;
    const fresh = itemRow(m);
    row.replaceWith(fresh);
  });
  renderDocket(true);
}

function renderDocket(animate){
  const d = $("docket");
  d.hidden = false;
  const ls = lines();
  const n = ls.reduce((s, l) => s + l.qty, 0);
  const amount = total();

  $("dLines").textContent = n
    ? n + " " + (n === 1 ? itemWord().replace(/s$/, "") : itemWord())
      + (hasPacks() && S.packs > 1 ? " \u00d7 " + S.packs + " " + packWord(S.packs) : "")
    : "Nothing yet";

  const amt = $("dTotal");
  amt.textContent = money(amount);
  if (animate){ amt.classList.add("bump"); setTimeout(() => amt.classList.remove("bump"), 200); }

  const send = $("send");
  const label = $("sendLabel");
  if (!ls.length){
    send.setAttribute("aria-disabled", "true");
    send.removeAttribute("href");
    label.textContent = "Add something first";
  } else {
    send.setAttribute("aria-disabled", "false");
    send.href = waLink();
    label.textContent = "Send this order on WhatsApp";
  }
}

/* ---------- the one message ---------- */
function orderText(){
  const ls = lines();
  const packs = hasPacks() ? S.packs : 1;

  const human = [
    "\uD83D\uDED2 " + CONFIG.BUSINESS + " order",
    "",
    (S.vendor.restaurant_name || S.vendor.restaurant_id)
      + " \u2014 " + (S.zone.zone_name || S.zone.zone_id),
    ...ls.map(l => l.qty + " \u00d7 " + l.name),
  ];
  if (hasPacks() && packs > 1) human.push("\uD83D\uDCE6 " + packs + " " + packWord(packs));
  human.push("", "Items: " + money(total()), "(delivery fee confirmed in the chat)", "", "");

  // The machine line. No prices in it on purpose: this is editable text, so
  // the bot looks every item up in the sheet and prices it there.
  const code = "#OWA1"
    + " s=" + (S.service ? S.service.service_id : "")
    + " z=" + S.zone.zone_id
    + " r=" + S.vendor.restaurant_id
    + " p=" + packs
    + " i=" + ls.map(l => l.id + "*" + l.qty).join(",");

  return human.join("\n") + code;
}

function waLink(){
  return "https://wa.me/" + CONFIG.WA_NUMBER.replace(/\D/g, "")
    + "?text=" + encodeURIComponent(orderText());
}

/* ---------- boot ---------- */
function failScreen(err){
  $("docket").hidden = true;
  $("main").innerHTML = "";
  const s = el("div", "state");
  const unset = String(err && err.message || "").startsWith("unset:");
  s.append(el("h2", null, unset ? "This menu is not set up yet" : "The menu did not load"));
  s.append(el("p", null, unset
    ? "The four sheet links at the top of this page still need filling in."
    : "Check your connection and try again. You can also order in the chat."));
  const b = el("button", null, "Try again"); b.type = "button";
  b.addEventListener("click", () => { boot(); });
  s.append(b);
  $("main").append(s);
}

async function boot(){
  $("main").innerHTML = "";
  $("main").append($("boot") || el("div"));
  try{
    await load();
    if (CONFIG.BUSINESS) $("brand").textContent = CONFIG.BUSINESS;
    render();
  }catch(err){
    failScreen(err);
  }
}
boot();
</script>
