     SETUP — the only block you ever need to edit.

     WA_NUMBER   your WhatsApp ordering line, digits only, no + or spaces.

     SHEETS      In Google Sheets: File > Share > Publish to web.
                 Publish EACH TAB ON ITS OWN as "Comma-separated values".

                 Never publish "Entire Document". Your Ops, Riders and

const CONFIG = {
  WA_NUMBER: "2347053594258",

  SHEETS: {
    services:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=2002841459&single=true&output=csv",

    restaurants: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=350484638&single=true&output=csv",
    menu:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=1751665817&single=true&output=csv"
  },

  BUSINESS: "Owa Delivery",
  CURRENCY: "\u20A6",

  // Minutes to trust the copy saved on the customer's phone before refetching.
  // Past this it tries the network first but still falls back to the saved
  // copy, so the menu keeps working when their data drops out.
  CACHE_MINUTES: 30,

  // These must match the limits in the bot's 'Web: Resolve Order' node, or the
  // page could build a basket the bot then trims.
  MAX_LINES: 20,
  MAX_QTY: 20,
  MAX_PACKS: 20,

  // Show a search box once a vendor's menu passes this many items.
  SEARCH_AFTER: 12,

  // A vendor row must SAY which area and which service it belongs to.
  //
  // With this on, a vendor whose zone_id or service_id is blank is treated as
  // an unfinished row and hidden, rather than being read as "sells everything,
  // everywhere". One blank cell read as a wildcard is what makes every vendor
  // appear under every area and every service - the row matches all of them.
  //
  // Visit /menu/?debug=1 to see exactly which rows are being held back and why.
  // Set this to false to go back to treating a blank cell as "all".
  STRICT_IDS: true
};
</script>

<script>
"use strict";

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const norm = (v) => String(v == null ? "" : v).trim();
const low = (v) => norm(v).toLowerCase();
const money = (n) => CONFIG.CURRENCY + Math.round(Number(n) || 0).toLocaleString("en-NG");
const cap = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);

/* Sheet money columns arrive as 500, "500", "N500", "1,500.00". */
const cash = (v) => {
  const n = Number(String(v == null ? "" : v).replace(/,/g, "").replace(/[^\d.-]/g, ""));
  return Number.isFinite(n) && n > 0 ? n : 0;
};

/* A row is live unless it explicitly says otherwise. Matches the bot. */
const live = (r) => !["false", "no", "0"].includes(low(r && r.active));

/* Zones and services may be written singular or plural, and a plural cell may
   hold a list: "ibereko, mowo" or "ibereko;mowo". Both spellings are read, so
   the page can never disagree with the sheet over a column name. */
const idList = (row, singular, plural) => {
  const raw = norm(row && (norm(row[plural]) !== "" ? row[plural] : row[singular]));
  return raw ? raw.split(/[,;|]/).map(low).filter(Boolean) : [];
};

/* '*' or 'all' is how a vendor row says it genuinely covers everything - the
   same wildcard the chat flow's 'B3: Build Restaurant List' honours. A BLANK
   cell is not a wildcard: it means nobody has filled the column in yet, which
   is why STRICT_IDS holds those rows back instead of matching them to
   everything. Write '*' when you mean it and the page will believe you. */
const WILD = (list) => list.includes("*") || list.includes("all");
const covers = (list, want) => WILD(list) || list.length === 0 || list.includes(low(want));

/* =====================================================================
   Data
   ===================================================================== */
const CACHE_KEY = "owa.menu.v2";
const PREF_KEY = "owa.menu.prefs.v1";
let DATA = null;
const WARN = [];

function parseCSV(text){
  const rows = []; let row = [], val = "", q = false;
  const s = String(text).replace(/\r\n?/g, "\n");
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){
      if (c === '"'){ if (s[i+1] === '"'){ val += '"'; i++; } else q = false; }
      else val += c;
    }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(val); val = ""; }
    else if (c === "\n"){ row.push(val); rows.push(row); row = []; val = ""; }
    else val += c;
  }
  if (val !== "" || row.length){ row.push(val); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => low(h).replace(/\s+/g, "_"));
  return rows.filter(r => r.some(c => norm(c) !== ""))
    .map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = norm(r[i]); }); return o; });
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ /* private mode */ } }
};

async function fetchAll(){
  const keys = Object.keys(CONFIG.SHEETS);
  const texts = await Promise.all(keys.map(async k => {
    const url = CONFIG.SHEETS[k];
    if (!/^https:\/\//i.test(url)) throw new Error("unset:" + k);
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("http:" + k + ":" + r.status);
    return r.text();
  }));
  const out = {};
  keys.forEach((k, i) => { out[k] = parseCSV(texts[i]); });
  if (!out.restaurants.length || !out.menu.length) throw new Error("empty");
  return out;
}

async function load(){
  const c = store.get(CACHE_KEY);
  if (c && c.data && (Date.now() - c.at) < CONFIG.CACHE_MINUTES * 60000){ DATA = c.data; return; }
  try { DATA = await fetchAll(); store.set(CACHE_KEY, { at: Date.now(), data: DATA }); }
  catch(err){ if (c && c.data){ DATA = c.data; return; } throw err; }
}

/* =====================================================================
   THE FILTER CHAIN

   One predicate per relationship, used by the lists AND by the counts.
   Working a count out a second way is the classic source of "12 vendors"
   printed next to a list of three, so nothing here recounts anything.
   ===================================================================== */
const allZones = () => (DATA.zones || []).filter(live);
const allServices = () => (DATA.services || []).filter(live);
const allVendors = () => (DATA.restaurants || []).filter(live);
const allItems = () => (DATA.menu || []).filter(live);

const itemsOf = (vendorId) => allItems().filter(m => low(m.restaurant_id) === low(vendorId));

/* A vendor with nothing on its menu is a dead end, so it is never offered. */
const stocked = (v) => itemsOf(v.restaurant_id).length > 0;

const vendorZones = (v) => idList(v, "zone_id", "zone_ids");
const vendorServices = (v) => idList(v, "service_id", "service_ids");

/* A row that never says where it is or what it sells cannot be placed. Under
   STRICT_IDS it is held back instead of matching everything. */
const complete = (v) => !CONFIG.STRICT_IDS
  || (vendorZones(v).length > 0 && vendorServices(v).length > 0);
const wildZone = (v) => WILD(vendorZones(v));
const wildService = (v) => WILD(vendorServices(v));

const incomplete = () => allVendors().filter(v => stocked(v) && !complete(v));

const vendorsIn = (zoneId, serviceId) => allVendors().filter(v =>
  stocked(v) && complete(v)
  && (!zoneId || covers(vendorZones(v), zoneId))
  && (!serviceId || covers(vendorServices(v), serviceId)));

/* Only areas that can actually be served, and only services that actually have
   a stocked vendor in the chosen area. Every dead end is removed before the
   customer can walk into it. */
const zonesWithVendors = () => allZones().filter(z => vendorsIn(z.zone_id, null).length > 0);
const servicesIn = (zoneId) => allServices().filter(s => vendorsIn(zoneId, s.service_id).length > 0);

/* =====================================================================
   State
   ===================================================================== */
const S = { zone: null, service: null, vendor: null, packs: 1,
            qty: Object.create(null), cat: "", search: "" };

const svcVal = (k, dflt) => { const v = norm(S.service && S.service[k]); return v === "" ? dflt : v; };
const hasPacks = () => low(svcVal("has_packs", "TRUE")) !== "false";
const itemWord = () => svcVal("item_label_plural", "items");
const vendorWord = () => svcVal("vendor_label", "vendor");
const packWord = (n) => n === 1 ? svcVal("pack_label", "pack")
                                : svcVal("pack_label_plural", svcVal("pack_label", "pack") + "s");
const packagingFee = () => cash(S.vendor && S.vendor.packaging_fee);

const lines = () => (S.vendor ? itemsOf(S.vendor.restaurant_id) : [])
  .filter(m => S.qty[m.item_id] > 0)
  .map(m => ({ id: m.item_id, name: m.item_name, price: cash(m.price), qty: S.qty[m.item_id] }));

const packs = () => hasPacks() ? Math.min(CONFIG.MAX_PACKS, Math.max(1, S.packs)) : 1;
const goods = () => lines().reduce((s, l) => s + l.price * l.qty, 0) * packs();
const packaging = () => packagingFee() * packs();
const shown = () => goods() + packaging();

/* =====================================================================
   Deep links and the URL

   A vendor can share their own menu, and each service card on the homepage
   can open the menu already filtered:
       /menu/?service=food
       /menu/?zone=ibereko&vendor=R001
   Anything that does not resolve is ignored rather than half-applied.
   ===================================================================== */
function applyUrl(){
  const p = new URLSearchParams(location.search);
  const pick = (rows, key, want) => rows.find(r => low(r[key]) === low(want)) || null;

  const z = p.get("zone"), sv = p.get("service"), vd = p.get("vendor");
  if (z) S.zone = pick(zonesWithVendors(), "zone_id", z);
  if (!S.zone){
    const saved = store.get(PREF_KEY);
    if (saved && saved.zone) S.zone = pick(zonesWithVendors(), "zone_id", saved.zone);
  }
  if (sv && S.zone) S.service = pick(servicesIn(S.zone.zone_id), "service_id", sv);
  if (vd && S.zone) S.vendor = pick(vendorsIn(S.zone.zone_id, S.service && S.service.service_id),
                                    "restaurant_id", vd);

  // A vendor named without a service: infer it, so the wording and the pack
  // rules are still right for that service.
  if (S.vendor && !S.service){
    const ids = vendorServices(S.vendor);
    if (ids.length === 1) S.service = allServices().find(s => low(s.service_id) === ids[0]) || null;
  }
}

function syncUrl(){
  const p = new URLSearchParams();
  if (S.zone) p.set("zone", S.zone.zone_id);
  if (S.service) p.set("service", S.service.service_id);
  if (S.vendor) p.set("vendor", S.vendor.restaurant_id);
  const dbg = new URLSearchParams(location.search).get("debug");
  if (dbg) p.set("debug", dbg);
  const q = p.toString();
  history.replaceState(null, "", q ? "?" + q : location.pathname);
  if (S.zone) store.set(PREF_KEY, { zone: S.zone.zone_id });
}

/* A basket survives an accidental reload, but only under the same vendor - a
   basket from another kitchen must never reappear under this one. */
const basketKey = () => "owa.basket." + low(S.vendor && S.vendor.restaurant_id);
const saveBasket = () => { if (S.vendor) store.set(basketKey(), { qty: S.qty, packs: S.packs, at: Date.now() }); };

function loadBasket(){
  if (!S.vendor) return;
  const b = store.get(basketKey());
  if (!b || (Date.now() - (b.at || 0)) > 6 * 3600 * 1000) return;   // stale after 6 hours
  const ids = new Set(itemsOf(S.vendor.restaurant_id).map(m => String(m.item_id)));
  const kept = Object.create(null);
  Object.keys(b.qty || {}).forEach(k => { if (ids.has(String(k))) kept[k] = b.qty[k]; });
  S.qty = kept;
  S.packs = Math.max(1, Math.min(CONFIG.MAX_PACKS, Number(b.packs) || 1));
}

/* =====================================================================
   Render
   ===================================================================== */
function render(){
  const body = $("mBody");
  body.innerHTML = "";
  syncUrl();
  renderTrail();

  if (!S.zone) return stepZone(body);
  if (!S.service) return stepService(body);
  if (!S.vendor) return stepVendor(body);
  stepMenu(body);
  renderDocket();
}

function goto(patch){
  Object.assign(S, patch);
  render();
  window.scrollTo(0, 0);
}

function renderTrail(){
  const t = $("mTrail"); t.innerHTML = "";
  const crumbs = [];
  if (S.zone) crumbs.push([S.zone.zone_name || S.zone.zone_id,
    () => goto({ zone: null, service: null, vendor: null, qty: Object.create(null), cat: "", search: "" })]);
  if (S.service) crumbs.push([S.service.service_name || S.service.service_id,
    () => goto({ service: null, vendor: null, qty: Object.create(null), cat: "", search: "" })]);
  if (S.vendor) crumbs.push([S.vendor.restaurant_name || S.vendor.restaurant_id,
    () => goto({ vendor: null, qty: Object.create(null), cat: "", search: "" })]);

  t.hidden = crumbs.length === 0;
  crumbs.forEach(([label, go], i) => {
    if (i){ const s = el("span", "sep", "\u203A"); s.setAttribute("aria-hidden", "true"); t.append(s); }
    if (i === crumbs.length - 1){ t.append(el("span", "now", label)); return; }
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", go);
    t.append(b);
  });
}

function chooser(host, heading, title, lede, options, empty){
  $("mDocket").hidden = true;
  const sec = el("section", "m-step");
  sec.append(el(heading, null, title));
  if (lede) sec.append(el("p", "m-lede", lede));

  if (!options.length){ sec.append(emptyState(empty)); host.append(sec); return; }

  const ul = el("ul", "m-choices");
  options.forEach(o => {
    const li = el("li");
    const b = el("button"); b.type = "button";
    const nm = el("span", "m-name");
    nm.append(document.createTextNode(o.name));
    if (o.sub) nm.append(el("span", "m-sub", o.sub));
    const go = el("span", "m-go", "\u203A"); go.setAttribute("aria-hidden", "true");
    b.append(nm, go);
    b.addEventListener("click", o.go);
    li.append(b); ul.append(li);
  });
  sec.append(ul);
  host.append(sec);
  if (WARN.length) host.append(diagnostics());
}

function whatsappBtn(label, text){
  const a = el("a", "btn", label);
  a.href = "https://wa.me/" + CONFIG.WA_NUMBER.replace(/\D/g, "") + "?text=" + encodeURIComponent(text);
  a.target = "_blank"; a.rel = "noopener";
  return a;
}

function emptyState(text){
  const s = el("div", "m-state");
  s.append(el("h2", null, "Nothing here yet"));
  s.append(el("p", null, text || "Please try again shortly."));
  const acts = el("div", "m-acts");
  acts.append(whatsappBtn("Ask us on WhatsApp", "Hi, I want to order."));
  s.append(acts);

  // An empty list caused by unfinished sheet rows looks identical to an empty
  // list caused by having no vendors, and the two need completely different
  // fixes. The customer still sees the friendly message above; this says which
  // one it is, in the console and on ?debug=1, so it is never a guess.
  const bad = incomplete();
  if (bad.length){
    const msg = bad.length + " vendor row(s) are hidden because zone_id or "
      + "service_id is blank: " + bad.map(v => v.restaurant_id).join(", ")
      + ". Fill those columns in the Restaurants tab.";
    try { console.warn("[Owa menu] " + msg); } catch(e){}
    if (new URLSearchParams(location.search).get("debug")) s.append(el("p", "m-lede", msg));
  }
  return s;
}

function stepZone(host){
  chooser(host, "h1", "Where are we delivering?",
    "Pick the area closest to your house. It sets the delivery rate for your order.",
    zonesWithVendors().map(z => {
      const n = vendorsIn(z.zone_id, null).length;
      return { name: z.zone_name || z.zone_id,
               sub: n + (n === 1 ? " vendor" : " vendors") + " delivering here",
               go: () => goto({ zone: z, service: null, vendor: null }) };
    }),
    "No areas are open for online ordering yet. Message us and we will take your order directly.");
}

function stepService(host){
  const where = S.zone.zone_name || S.zone.zone_id;
  chooser(host, "h1", "What do you need?",
    "Only what is available in " + where + " right now.",
    servicesIn(S.zone.zone_id).map(s => {
      const n = vendorsIn(S.zone.zone_id, s.service_id).length;
      return { name: s.service_name || s.service_id,
               sub: norm(s.service_tagline) || (n + (n === 1 ? " vendor" : " vendors")),
               go: () => goto({ service: s, vendor: null }) };
    }),
    "Nothing is available in " + where + " for online ordering yet. Message us and we will sort it out.");
}

function stepVendor(host){
  const vs = vendorsIn(S.zone.zone_id, S.service.service_id);
  const where = S.zone.zone_name || S.zone.zone_id;
  chooser(host, "h1", "Choose a " + vendorWord(),
    vs.length + (vs.length === 1 ? " option" : " options") + " in " + where + ".",
    vs.map(v => {
      const items = itemsOf(v.restaurant_id);
      const cats = [...new Set(items.map(m => norm(m.category)).filter(Boolean))];
      const bits = [items.length + (items.length === 1 ? " item" : " items")];
      if (cats.length) bits.push(cats.slice(0, 3).join(" \u00b7 "));
      return { name: v.restaurant_name || v.restaurant_id,
               sub: bits.join("   \u2014   "),
               go: () => { S.vendor = v; S.qty = Object.create(null); S.packs = 1;
                           S.cat = ""; S.search = ""; loadBasket();
                           render(); window.scrollTo(0, 0); } };
    }),
    "No " + vendorWord() + " here is taking online orders at the moment.");
}

function stepMenu(host){
  const all = itemsOf(S.vendor.restaurant_id);
  const sec = el("section", "m-step");
  sec.append(el("h1", null, S.vendor.restaurant_name || S.vendor.restaurant_id));

  const meta = [];
  const addr = norm(S.vendor.restaurant_address) || norm(S.vendor.address);
  if (addr) meta.push(addr);
  if (packagingFee() > 0) meta.push("Packaging " + money(packagingFee()) + " per " + packWord(1));
  sec.append(el("p", "m-lede", meta.length ? meta.join("   \u00b7   ")
    : "Tap + to add. Your total updates as you go."));
  host.append(sec);

  const cats = [...new Set(all.map(m => norm(m.category)).filter(Boolean))];

  if (all.length > CONFIG.SEARCH_AFTER){
    const box = el("div", "m-search");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>';
    const inp = document.createElement("input");
    inp.type = "search"; inp.value = S.search;
    inp.placeholder = "Search this menu";
    inp.setAttribute("aria-label", "Search this menu");
    inp.addEventListener("input", () => { S.search = inp.value; drawPad(); });
    box.append(svg, inp);
    host.append(box);
  }

  if (cats.length > 1){
    const strip = el("div", "m-cats");
    strip.setAttribute("role", "group");
    strip.setAttribute("aria-label", "Menu sections");
    [["", "All"], ...cats.map(c => [c, c])].forEach(([val, label]) => {
      const b = el("button", null, label); b.type = "button";
      b.dataset.cat = val;
      b.setAttribute("aria-pressed", String(S.cat === val));
      b.addEventListener("click", () => { S.cat = val; drawPad(); });
      strip.append(b);
    });
    host.append(strip);
  }

  const padHost = el("div"); padHost.id = "mPadHost";
  host.append(padHost);
  drawPad();

  if (WARN.length) host.append(diagnostics());
}

function visibleItems(){
  const q = low(S.search);
  return itemsOf(S.vendor.restaurant_id).filter(m => {
    if (S.cat && norm(m.category) !== S.cat) return false;
    if (!q) return true;
    return low(m.item_name).includes(q) || low(m.category).includes(q);
  });
}

function drawPad(){
  const host = $("mPadHost");
  if (!host) return;
  host.innerHTML = "";

  // Re-mark the section pills in place, so the strip does not jump under the thumb.
  const strip = document.querySelector(".m-cats");
  if (strip) [...strip.children].forEach(b =>
    b.setAttribute("aria-pressed", String((b.dataset.cat || "") === S.cat)));

  const rows = visibleItems();
  if (!rows.length){
    const s = el("div", "m-state");
    s.append(el("h2", null, "Nothing matches"));
    s.append(el("p", null, S.search ? "Try a different word, or clear the search."
                                    : "This section is empty at the moment."));
    host.append(s);
    renderDocket();
    return;
  }

  const groups = new Map();
  rows.forEach(m => {
    const k = norm(m.category) || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  });

  groups.forEach((list, catName) => {
    if (catName && !S.cat) host.append(el("h2", "m-cat-head", catName));
    const ul = el("ul", "m-pad");
    list.forEach(m => ul.append(itemRow(m)));
    host.append(ul);
  });

  if (hasPacks()){
    const box = el("div", "m-packs");
    const txt = el("p");
    txt.append(el("strong", null, "How many " + packWord(2) + "?"));
    txt.append(document.createTextNode("The whole order above, repeated."
      + (packagingFee() > 0 ? " Packaging is charged per " + packWord(1) + "." : "")));
    box.append(txt, stepper({
      value: S.packs, min: 1, max: CONFIG.MAX_PACKS,
      lessLabel: "One fewer " + packWord(1), moreLabel: "One more " + packWord(1),
      change: (v) => { S.packs = v; saveBasket(); drawPad(); }
    }));
    host.append(box);
  }

  renderDocket();
}

function stepper({ value, min, max, lessLabel, moreLabel, change }){
  const st = el("div", "m-stepper");
  const less = el("button", "m-less", "\u2212"); less.type = "button";
  less.setAttribute("aria-label", lessLabel);
  less.disabled = value <= min;
  const q = el("span", "m-qty", String(value));
  q.dataset.zero = value === 0 ? "1" : "0";
  const more = el("button", "m-add", "+"); more.type = "button";
  more.setAttribute("aria-label", moreLabel);
  more.disabled = value >= max;
  less.addEventListener("click", () => change(Math.max(min, value - 1)));
  more.addEventListener("click", () => change(Math.min(max, value + 1)));
  st.append(less, q, more);
  return st;
}

function itemRow(m){
  const qty = S.qty[m.item_id] || 0;
  const li = el("li", "m-row" + (qty ? " m-in" : ""));
  li.dataset.item = m.item_id;

  const line = el("div", "m-line");
  const item = el("div", "m-item");
  item.append(el("span", "m-n", m.item_name || m.item_id));
  line.append(item, el("span", "m-leader"), el("span", "m-price", money(m.price)));

  li.append(line, stepper({
    value: qty, min: 0, max: CONFIG.MAX_QTY,
    lessLabel: "Remove one " + (m.item_name || "item"),
    moreLabel: "Add one " + (m.item_name || "item"),
    change: (v) => setQty(m, v)
  }));
  return li;
}

function setQty(m, v){
  // The bot accepts a fixed number of distinct lines. Stopping here is kinder
  // than letting the basket be silently trimmed after it has been sent.
  if (v > 0 && !S.qty[m.item_id] && lines().length >= CONFIG.MAX_LINES){
    alert("That is as many different items as one order can hold ("
      + CONFIG.MAX_LINES + "). Send this order, then start another.");
    return;
  }
  if (v === 0) delete S.qty[m.item_id]; else S.qty[m.item_id] = v;
  saveBasket();

  const rows = document.querySelectorAll(".m-row");
  for (const row of rows){
    if (row.dataset.item === String(m.item_id)){ row.replaceWith(itemRow(m)); break; }
  }
  renderDocket(true);
}

function renderDocket(animate){
  const d = $("mDocket");
  if (!S.vendor){ d.hidden = true; return; }
  d.hidden = false;

  const ls = lines();
  const n = ls.reduce((s, l) => s + l.qty, 0);

  const sum = $("mSum"); sum.innerHTML = "";
  if (ls.length){
    const add = (label, value) => {
      const r = el("div", "m-srow");
      r.append(el("span", null, label), el("b", null, money(value)));
      sum.append(r);
    };
    add(cap(itemWord()), goods());
    if (packaging() > 0) add("Packaging (" + packs() + " \u00d7 " + money(packagingFee()) + ")", packaging());
  }

  $("mCount").textContent = n
    ? n + " " + (n === 1 ? itemWord().replace(/s$/, "") : itemWord())
      + (hasPacks() && packs() > 1 ? "   \u00d7 " + packs() + " " + packWord(packs()) : "")
    : "Nothing yet";
  $("mNote").textContent = ls.length ? "Service charge and delivery added in the chat"
                                     : "Delivery is quoted in the chat";

  const amt = $("mTotal");
  amt.textContent = money(shown());
  if (animate){ amt.classList.add("m-bump"); setTimeout(() => amt.classList.remove("m-bump"), 200); }

  const send = $("mSend"), label = $("mSendLabel");
  if (!ls.length){
    send.setAttribute("aria-disabled", "true");
    send.removeAttribute("href"); send.removeAttribute("target");
    label.textContent = "Add something first";
  } else {
    send.setAttribute("aria-disabled", "false");
    send.href = waLink();
    send.target = "_blank"; send.rel = "noopener";
    label.textContent = "Send this order on WhatsApp";
  }
}

/* =====================================================================
   The one message
   ===================================================================== */
function orderText(){
  const ls = lines();
  const p = packs();

  const out = [
    "\uD83D\uDED2 " + CONFIG.BUSINESS + " order",
    "",
    (S.vendor.restaurant_name || S.vendor.restaurant_id)
      + " \u2014 " + (S.zone.zone_name || S.zone.zone_id),
    ...ls.map(l => l.qty + " \u00d7 " + l.name)
  ];
  if (hasPacks() && p > 1) out.push("\uD83D\uDCE6 " + p + " " + packWord(p));
  out.push("");
  out.push(cap(itemWord()) + ": " + money(goods()));
  if (packaging() > 0) out.push("Packaging: " + money(packaging()));
  out.push("(service charge and delivery confirmed in the chat)", "", "");

  // Ids and quantities only. No prices: this is editable text, so the bot looks
  // every item up in the sheet and prices it there.
  const code = "#OWA1"
    + " s=" + (S.service ? S.service.service_id : "")
    + " z=" + S.zone.zone_id
    + " r=" + S.vendor.restaurant_id
    + " p=" + p
    + " i=" + ls.map(l => l.id + "*" + l.qty).join(",");

  return out.join("\n") + code;
}

const waLink = () => "https://wa.me/" + CONFIG.WA_NUMBER.replace(/\D/g, "")
  + "?text=" + encodeURIComponent(orderText());

/* =====================================================================
   Sheet check

   Visible only with ?debug=1, so a customer never sees it. It names the
   sheet problems that quietly make a menu look wrong - a vendor with no
   area, an item pointing at a vendor that is not there, a price that is not
   a number - which are far easier to fix when something points at them.
   ===================================================================== */
function audit(){
  WARN.length = 0;
  if (!new URLSearchParams(location.search).get("debug")) return;

  const zoneIds = new Set(allZones().map(z => low(z.zone_id)));
  const svcIds = new Set(allServices().map(s => low(s.service_id)));
  const vendIds = new Set(allVendors().map(v => low(v.restaurant_id)));
  const add = (title, ids) => { if (ids.length) WARN.push([title, ids]); };

  add(CONFIG.STRICT_IDS
      ? "Vendors HIDDEN because zone_id is blank - fill it in on the Restaurants tab"
      : "Vendors with a blank zone_id, so they appear in EVERY area",
    allVendors().filter(v => vendorZones(v).length === 0).map(v => v.restaurant_id));
  add(CONFIG.STRICT_IDS
      ? "Vendors HIDDEN because service_id is blank - fill it in on the Restaurants tab"
      : "Vendors with a blank service_id, so they appear under EVERY service",
    allVendors().filter(v => vendorServices(v).length === 0).map(v => v.restaurant_id));
  add("Vendors pointing at a zone that is not in the Zones tab",
    allVendors().filter(v => !wildZone(v) && vendorZones(v).some(z => !zoneIds.has(z)))
      .map(v => v.restaurant_id));
  add("Vendors pointing at a service that is not in the ServiceTypes tab",
    allVendors().filter(v => !wildService(v) && vendorServices(v).some(s => !svcIds.has(s)))
      .map(v => v.restaurant_id));
  add("Vendors covering EVERY area via '*' - correct only if they really do",
    allVendors().filter(wildZone).map(v => v.restaurant_id));
  add("Vendors hidden because they have no active menu items",
    allVendors().filter(v => !stocked(v)).map(v => v.restaurant_id));
  add("Items whose restaurant_id matches no active vendor",
    allItems().filter(m => !vendIds.has(low(m.restaurant_id))).map(m => m.item_id));
  add("Items with a missing or unreadable price",
    allItems().filter(m => cash(m.price) <= 0).map(m => m.item_id));

  const seen = new Set(), dupes = [];
  allItems().forEach(m => { const k = low(m.item_id);
    if (seen.has(k)) dupes.push(m.item_id); else seen.add(k); });
  add("Duplicate item_id values - only the first is reachable", dupes);
}

function diagnostics(){
  const box = el("div", "m-diag");
  box.append(el("h3", null, "Sheet check: " + WARN.length
    + (WARN.length === 1 ? " thing to look at" : " things to look at")));
  WARN.forEach(([title, ids]) => {
    box.append(el("p", null, title));
    const ul = el("ul");
    ids.slice(0, 25).forEach(i => { const li = el("li"); li.append(el("code", null, String(i))); ul.append(li); });
    if (ids.length > 25) ul.append(el("li", null, "\u2026and " + (ids.length - 25) + " more"));
    box.append(ul);
  });
  return box;
}

/* =====================================================================
   Boot
   ===================================================================== */
function failScreen(err){
  $("mDocket").hidden = true;
  $("mTrail").hidden = true;
  const body = $("mBody"); body.innerHTML = "";
  const code = String((err && err.message) || "");
  const unset = code.startsWith("unset:");
  const empty = code === "empty";

  const s = el("div", "m-state");
  s.append(el("h2", null, unset ? "This menu is not connected yet"
    : empty ? "The menu is empty" : "The menu did not load"));
  s.append(el("p", null, unset
    ? "The sheet links at the top of this page still need filling in."
    : empty ? "No vendors or items came back from the sheet. Check that the Restaurants and MenuItems tabs are still published."
    : "Check your connection and try again \u2014 or just order in the chat, it works the same."));

  const acts = el("div", "m-acts");
  acts.append(whatsappBtn("Order on WhatsApp", "Hi, I want to order."));
  const again = el("button", "btn btn-ghost", "Try again");
  again.type = "button";
  again.addEventListener("click", boot);
  acts.append(again);
  s.append(acts);
  body.append(s);
}

async function boot(){
  const body = $("mBody");
  body.innerHTML = "";
  const wait = el("div", "m-state");
  wait.setAttribute("aria-busy", "true");
  wait.append(el("div", "m-skel"), el("div", "m-skel"), el("div", "m-skel"),
              el("p", null, "Loading today's menu\u2026"));
  body.append(wait);

  try{
    await load();
    audit();
    applyUrl();
    if (S.vendor) loadBasket();
    render();
  }catch(err){
    failScreen(err);
  }
}

window.addEventListener("popstate", () => {
  S.zone = S.service = S.vendor = null;
  S.qty = Object.create(null); S.packs = 1; S.cat = ""; S.search = "";
  applyUrl();
  if (S.vendor) loadBasket();
  render();
});

boot();
</script>
</body>
</html>
