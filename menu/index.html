<!-- ====================================================================
     SETUP — the only block you ever need to edit.

     WA_NUMBER   your WhatsApp ordering line, digits only, no + or spaces.

     SHEETS      In Google Sheets: File > Share > Publish to web.
                 Publish EACH TAB ON ITS OWN as "Comma-separated values".

                 Never publish "Entire Document". Your Ops, Riders and
                 Settings tabs hold staff phone numbers and configuration,
                 and publishing the whole file would put them on the open web.
     ==================================================================== -->
<script>
const CONFIG = {
  WA_NUMBER: "2347053594258",

  SHEETS: {
    services:    "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=2002841459&single=true&output=csv",
    zones:       "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=1239200434&single=true&output=csv",
    restaurants: "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=350484638&single=true&output=csv",
    menu:        "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7abhjy0RdYu94xk-atAimSn03jwxvEWnGWjzrn_f5YQqlbK7najZ1DuXCnFuzB3YYN7Pd4n_lu-iD/pub?gid=1751665817&single=true&output=csv"
  },

  BUSINESS: "Owa Delivery",
  CURRENCY: "\u20A6",

  // Minutes to trust the copy saved on the customer's phone before refetching.
  // Past this it tries the network first but still falls back to the saved
  // copy, so the menu keeps working when their data drops out.
  CACHE_MINUTES: 30,

  // These must match the limits in the bot's 'Web: Resolve Order' node, or the
  // page could build a basket the bot then trims.
  MAX_LINES: 20,
  MAX_QTY: 20,
  MAX_PACKS: 20,

  // Show a search box once a vendor's menu passes this many items.
  SEARCH_AFTER: 12,

  // A vendor row must SAY which area and which service it belongs to.
  //
  // With this on, a vendor whose zone_id or service_id is blank is treated as
  // an unfinished row and hidden, rather than being read as "sells everything,
  // everywhere". One blank cell read as a wildcard is what makes every vendor
  // appear under every area and every service - the row matches all of them.
  //
  // Visit /menu/?debug=1 to see exactly which rows are being held back and why.
  // Set this to false to go back to treating a blank cell as "all".
  STRICT_IDS: true
};
</script>

<style>
/* --------------------------------------------------------------------
   Menu-specific layer only.

   Everything structural comes from the site's own stylesheet: .wrap,
   .btn, .btn-ghost, .card, .badge, .eyebrow, header, footer.

   NOTE ON COLOUR. This block used to fall back to light-theme values
   (--text, --bg) that the site stylesheet never defined, so the menu
   rendered near-black text and a white docket on a near-black page.
   Those alias tokens now exist in assets/style.css, and everything below
   is stated in terms of the brand palette rather than hoping for it.
   -------------------------------------------------------------------- */
.menu-page{
  --m-accent: var(--teal);
  --m-accent-hi: var(--teal-hi);
  --m-ink: var(--white);
  --m-soft: var(--text-soft);
  --m-soft-2: var(--text-soft-2);
  --m-rule: var(--line);
  --m-rule-hi: var(--line-strong);
  --m-fill: rgba(18,167,151,0.10);
  --m-surface: var(--card);
  --m-warn: var(--rust);
  --m-mono: var(--mono);
  --m-pad-b: env(safe-area-inset-bottom, 0px);

  /* Kept in step with the real docket height by JS, so the last item in a
     long menu is never parked underneath it. */
  --m-docket-h: 190px;
  padding-bottom: calc(var(--m-docket-h) + 28px + var(--m-pad-b));
}

/* Several blocks below set display:flex, which beats the browser's own rule
   for [hidden] and leaves hidden elements on screen. The docket's review bar
   showing "Review items" over an empty basket was exactly this. */
[hidden]{ display:none !important; }

/* ---- the four-step rail: where you are, and what is still to come ---- */
.m-rail{
  display:flex; gap:0; align-items:stretch;
  margin:0; list-style:none;
  /* Horizontal padding stays with .wrap, or the first step sits flush against
     the screen edge on a phone. Only the vertical padding is reset here. */
  padding-top:0; padding-bottom:0;
  border-bottom:1px solid var(--m-rule);
  overflow-x:auto; scrollbar-width:none;
}
.m-rail::-webkit-scrollbar{ display:none; }
.m-rail li{ flex:1 1 0; min-width:112px; position:relative; }
.m-rail li + li::before{
  content:''; position:absolute; left:0; top:14px; bottom:14px;
  width:1px; background:var(--m-rule);
}
.m-rail .m-rail-inner,
.m-rail button{
  font:inherit; width:100%; text-align:left; background:none; border:0;
  padding:.85rem 1rem .85rem 0; color:inherit; display:block;
}
.m-rail li + li .m-rail-inner,
.m-rail li + li button{ padding-left:1rem; }
.m-rail button{ cursor:pointer; }
.m-rail .m-rail-k{
  display:block; font-family:var(--m-mono); font-size:.66rem;
  letter-spacing:.09em; color:var(--m-soft-2);
}
.m-rail .m-rail-v{
  display:block; font-size:.9rem; margin-top:.25rem; color:var(--m-soft-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.m-rail [data-state="done"] .m-rail-k{ color:var(--m-accent); }
.m-rail [data-state="done"] .m-rail-v{ color:var(--m-ink); font-weight:600; text-decoration:underline; text-underline-offset:3px; }
.m-rail [data-state="done"] button:hover .m-rail-v{ color:var(--m-accent); }
.m-rail [data-state="now"] .m-rail-k{ color:var(--m-accent); }
.m-rail [data-state="now"] .m-rail-v{ color:var(--m-ink); font-weight:600; }
.m-rail [data-state="now"]::after{
  content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--m-accent);
}

/* ---- a step ---- */
.m-step{ padding:2rem 0 .5rem; }
.m-step h1, .m-step h2{ font-size:clamp(1.5rem,3.6vw,2.05rem); margin:0; }
.m-step .m-lede{ margin:.55rem 0 1.4rem; color:var(--m-soft); max-width:56ch; }

/* ---- choice rows ---- */
.m-choices{ list-style:none; margin:0; padding:0; border-top:1px solid var(--m-rule); }
.m-choices li{ border-bottom:1px solid var(--m-rule); }
.m-choices button{
  font:inherit; width:100%; text-align:left; background:none; border:0; color:inherit;
  padding:1.05rem .25rem; cursor:pointer; display:flex; align-items:center; gap:.85rem;
  min-height:64px;
}
.m-choices button:hover, .m-choices button:focus-visible{ background:var(--m-fill); }
.m-choices .m-name{ font-weight:600; flex:1; min-width:0; font-family:'Bricolage Grotesque',sans-serif; font-size:1.05rem; }
.m-choices .m-sub{
  display:block; font-weight:400; font-size:.84rem; color:var(--m-soft);
  margin-top:.2rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-family:'Literata',Georgia,serif;
}
.m-choices .m-go{ color:var(--m-accent); font-weight:700; font-size:1.3rem; flex:none; }

/* ---- section pills ----
   top is the measured header height, not 0. At 0 they slid underneath the
   sticky site header and the customer could not see which section they were
   in, which was the whole point of having them. */
.m-cats{
  position:sticky; top:var(--header-h); z-index:20;
  display:flex; gap:.45rem; overflow-x:auto;
  margin:1.4rem 0 0; padding:.75rem 0;
  background:var(--bg-0);
  border-bottom:1px solid var(--m-rule);
  scrollbar-width:none;
}
.m-cats::-webkit-scrollbar{ display:none; }
.m-cats button{
  font-family:var(--m-mono); font-size:.76rem; font-weight:500; white-space:nowrap;
  padding:.5rem 1rem; border-radius:999px; cursor:pointer; min-height:38px;
  border:1px solid var(--m-rule-hi); background:none; color:var(--m-soft);
}
.m-cats button:hover{ color:var(--m-ink); border-color:var(--m-accent); }
.m-cats button[aria-pressed="true"]{
  background:var(--m-accent); border-color:var(--m-accent); color:var(--ink); font-weight:600;
}
.m-cats .m-cats-n{ opacity:.65; margin-left:.4rem; }

/* ---- search ---- */
.m-search{
  display:flex; align-items:center; gap:.7rem; margin:1.3rem 0 .2rem;
  padding:.8rem 1rem; border:1px solid var(--m-rule-hi); border-radius:12px;
  background:var(--m-surface);
}
.m-search:focus-within{ border-color:var(--m-accent); }
.m-search input{
  font:inherit; font-size:1rem; border:0; background:none; color:var(--m-ink);
  width:100%; min-width:0; outline:none;
}
.m-search input::placeholder{ color:var(--m-soft-2); }
.m-search svg{ width:18px; height:18px; fill:none; stroke:var(--m-soft); stroke-width:2; flex:none; }

/* ---- the order pad ---- */
.m-cat-head{
  display:flex; align-items:baseline; gap:.7rem;
  margin:2rem 0 .2rem; font-family:var(--m-mono); font-size:.76rem; font-weight:500;
  letter-spacing:.09em; color:var(--m-accent);
}
.m-cat-head::after{ content:''; flex:1; height:1px; background:var(--m-rule); }
.m-cat-head .m-cat-n{ color:var(--m-soft-2); letter-spacing:0; }
.m-pad{ list-style:none; margin:0; padding:0; }
.m-row{
  display:grid; grid-template-columns:1fr auto; align-items:center; gap:.15rem .9rem;
  padding:.95rem .25rem; border-bottom:1px solid var(--m-rule);
  border-radius:8px;
}
.m-row.m-in{ box-shadow:inset 3px 0 0 var(--m-accent); background:var(--m-fill); padding-left:.85rem; }
.m-line{ display:flex; align-items:baseline; grid-column:1/2; min-width:0; }
.m-item{ min-width:0; }
.m-item .m-n{ font-weight:600; display:block; font-family:'Bricolage Grotesque',sans-serif; font-size:1rem; }
.m-leader{ flex:1; height:0; border-bottom:1px dotted var(--m-rule-hi); margin:.5rem .55rem .3rem; }
.m-price{
  font-variant-numeric:tabular-nums; color:var(--m-ink); font-size:.92rem;
  white-space:nowrap; font-family:var(--m-mono);
}
.m-stepper{ display:flex; align-items:center; gap:.15rem; grid-column:2/3; grid-row:1/2; }
.m-stepper button{
  font:inherit; font-size:1.35rem; line-height:1; font-weight:600;
  width:44px; height:44px; border-radius:50%; cursor:pointer;
  display:grid; place-items:center;
  border:1px solid var(--m-rule-hi); background:none; color:var(--m-ink);
}
.m-stepper button.m-add{ border-color:var(--m-accent); color:var(--m-accent); }
.m-stepper button.m-add:hover{ background:var(--m-accent); color:var(--ink); }
.m-stepper button.m-less{ border-color:var(--m-warn); color:var(--m-warn); }
.m-stepper button:disabled{ opacity:.28; cursor:default; }
.m-stepper button:disabled:hover{ background:none; color:var(--m-ink); }
.m-qty{
  min-width:2.3rem; text-align:center; font-weight:700;
  font-variant-numeric:tabular-nums; font-family:var(--m-mono); color:var(--m-ink);
}
.m-qty[data-zero="1"]{ visibility:hidden; }

/* ---- packs ---- */
.m-packs{
  display:flex; align-items:center; justify-content:space-between; gap:1.2rem;
  margin:1.8rem 0 0; padding:1.1rem 1.2rem; background:var(--m-surface);
  border:1px solid var(--m-rule); border-radius:14px;
}
.m-packs p{ margin:0; font-size:.86rem; color:var(--m-soft); }
.m-packs strong{ display:block; color:var(--m-ink); font-size:1rem; margin-bottom:.15rem;
  font-family:'Bricolage Grotesque',sans-serif; }

/* ---- the docket ---- */
.m-docket{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:rgba(11,11,11,0.96);
  backdrop-filter:blur(12px);
  border-top:2px solid var(--m-accent);
  padding:.9rem 0 calc(.9rem + var(--m-pad-b));
  box-shadow:0 -16px 40px rgba(0,0,0,.55);
}
.m-docket .wrap{ display:grid; gap:.55rem; }
.m-sum{ display:grid; gap:.2rem; font-size:.84rem; color:var(--m-soft); }
.m-srow{ display:flex; justify-content:space-between; gap:1rem; }
.m-srow b{ color:var(--m-ink); font-weight:500; font-family:var(--m-mono); }
.m-tot{
  display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
  padding-top:.55rem; border-top:1px solid var(--m-rule);
}
.m-lab{ font-size:.86rem; color:var(--m-soft); }
.m-lab b{ display:block; color:var(--m-ink); font-size:.98rem; font-weight:600;
  font-family:'Bricolage Grotesque',sans-serif; }
.m-amt{
  font-size:1.75rem; font-weight:700; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; color:var(--m-ink); white-space:nowrap;
  font-family:'Bricolage Grotesque',sans-serif;
}
.m-send{ width:100%; min-height:56px; font-size:.86rem; }
.m-send[aria-disabled="true"]{ opacity:.4; pointer-events:none; }
.m-send svg{ width:21px; height:21px; fill:currentColor; flex:none; }
.m-fine{ margin:0; font-size:.75rem; color:var(--m-soft-2); text-align:center; line-height:1.55; }

/* review panel — what is in the basket, before it is sent */
.m-review-bar{ display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.m-review-toggle, .m-clear{
  font-family:var(--m-mono); font-size:.72rem; letter-spacing:.05em;
  background:none; border:0; cursor:pointer; padding:.35rem 0;
  color:var(--m-accent); text-decoration:underline; text-underline-offset:3px;
}
.m-clear{ color:var(--m-warn); }
.m-review{
  max-height:36vh; overflow-y:auto; margin:0; padding:.3rem 0 .1rem; list-style:none;
  border-top:1px solid var(--m-rule);
}
.m-review li{
  display:flex; justify-content:space-between; gap:1rem; align-items:baseline;
  padding:.5rem 0; font-size:.86rem; color:var(--m-soft);
  border-bottom:1px solid var(--m-rule);
}
.m-review li:last-child{ border-bottom:0; }
.m-review .m-rq{ font-family:var(--m-mono); color:var(--m-accent); flex:none; }
.m-review .m-rn{ flex:1; min-width:0; color:var(--m-ink); }
.m-review .m-rp{ font-family:var(--m-mono); flex:none; font-variant-numeric:tabular-nums; }

/* ---- states ---- */
.m-state{ padding:3.5rem 0; text-align:center; color:var(--m-soft); }
.m-state h2{ color:var(--m-ink); font-size:1.25rem; margin:0 0 .6rem; }
.m-state p{ margin:0 auto; max-width:36ch; }
.m-acts{ display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; margin-top:1.5rem; }
.m-skel{ height:1rem; background:var(--m-rule); border-radius:4px; margin:1rem auto; max-width:26rem; }
.m-skel:nth-of-type(2){ max-width:17rem; }
.m-skel:nth-of-type(3){ max-width:21rem; }
.m-diag{
  margin:1.8rem 0; padding:1.1rem 1.2rem; border:1px dashed var(--m-warn); border-radius:12px;
  font-size:.82rem; color:var(--m-soft);
}
.m-diag h3{ margin:0 0 .5rem; font-size:.9rem; color:var(--m-warn); }
.m-diag p{ margin:.7rem 0 0; font-weight:600; color:var(--m-ink); }
.m-diag ul{ margin:.3rem 0 0; padding-left:1.2rem; }
.m-diag code{ font-family:var(--m-mono); color:var(--m-accent); }

.m-noscript{
  margin:3rem 0; padding:1.5rem; border:1px solid var(--m-rule);
  border-radius:14px; background:var(--m-surface); color:var(--m-soft);
}
.m-noscript h2{ color:var(--m-ink); font-size:1.15rem; margin:0 0 .6rem; }

@media (prefers-reduced-motion:no-preference){
  .m-amt{ transition:color .18s ease; }
  .m-amt.m-bump{ color:var(--m-accent); }
}

@media (max-width:560px){
  /* All four steps share the width instead of scrolling. Seeing the whole
     shape of the order is the point of the rail, so a truncated area name is
     a better trade than a step hidden off-screen. */
  .m-rail li{ min-width:0; }
  .m-rail .m-rail-inner, .m-rail button{ padding-right:.5rem; }
  .m-rail li + li .m-rail-inner, .m-rail li + li button{ padding-left:.5rem; }
  .m-rail .m-rail-v{ font-size:.82rem; }

  /* A long dish name wraps, which left the price stranded beside the first
     line. Below this width the price sits under the name instead. */
  .m-line{ flex-direction:column; align-items:flex-start; }
  .m-leader{ display:none; }
  .m-price{ margin-top:.2rem; font-size:.86rem; }

  .m-amt{ font-size:1.5rem; }
  .m-review{ max-height:28vh; }
  .m-fine{ font-size:.72rem; }
}
</style>
</head>

<script>
"use strict";

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x != null) n.textContent = x; return n; };
const norm = (v) => String(v == null ? "" : v).trim();
const low = (v) => norm(v).toLowerCase();
const money = (n) => CONFIG.CURRENCY + Math.round(Number(n) || 0).toLocaleString("en-NG");
const cap = (s) => String(s || "").charAt(0).toUpperCase() + String(s || "").slice(1);

/* Sheet money columns arrive as 500, "500", "N500", "1,500.00". */
const cash = (v) => {
  const n = Number(String(v == null ? "" : v).replace(/,/g, "").replace(/[^\d.-]/g, ""));
  return Number.isFinite(n) && n > 0 ? n : 0;
};

/* A row is live unless it explicitly says otherwise. Matches the bot. */
const live = (r) => !["false", "no", "0"].includes(low(r && r.active));

/* Zones and services may be written singular or plural, and a plural cell may
   hold a list: "ibereko, mowo" or "ibereko;mowo". Both spellings are read, so
   the page can never disagree with the sheet over a column name. */
const idList = (row, singular, plural) => {
  const raw = norm(row && (norm(row[plural]) !== "" ? row[plural] : row[singular]));
  return raw ? raw.split(/[,;|]/).map(low).filter(Boolean) : [];
};

/* '*' or 'all' is how a vendor row says it genuinely covers everything - the
   same wildcard the chat flow's 'B3: Build Restaurant List' honours. A BLANK
   cell is not a wildcard: it means nobody has filled the column in yet, which
   is why STRICT_IDS holds those rows back instead of matching them to
   everything. Write '*' when you mean it and the page will believe you. */
const WILD = (list) => list.includes("*") || list.includes("all");
const covers = (list, want) => WILD(list) || list.length === 0 || list.includes(low(want));

/* =====================================================================
   Data
   ===================================================================== */
const CACHE_KEY = "owa.menu.v2";
const PREF_KEY = "owa.menu.prefs.v1";
let DATA = null;
const WARN = [];

function parseCSV(text){
  const rows = []; let row = [], val = "", q = false;
  const s = String(text).replace(/\r\n?/g, "\n");
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (q){
      if (c === '"'){ if (s[i+1] === '"'){ val += '"'; i++; } else q = false; }
      else val += c;
    }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(val); val = ""; }
    else if (c === "\n"){ row.push(val); rows.push(row); row = []; val = ""; }
    else val += c;
  }
  if (val !== "" || row.length){ row.push(val); rows.push(row); }
  if (!rows.length) return [];
  const head = rows.shift().map(h => low(h).replace(/\s+/g, "_"));
  return rows.filter(r => r.some(c => norm(c) !== ""))
    .map(r => { const o = {}; head.forEach((h, i) => { if (h) o[h] = norm(r[i]); }); return o; });
}

const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ /* private mode */ } }
};

async function fetchAll(){
  const keys = Object.keys(CONFIG.SHEETS);
  const texts = await Promise.all(keys.map(async k => {
    const url = CONFIG.SHEETS[k];
    if (!/^https:\/\//i.test(url)) throw new Error("unset:" + k);
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("http:" + k + ":" + r.status);
    return r.text();
  }));
  const out = {};
  keys.forEach((k, i) => { out[k] = parseCSV(texts[i]); });
  if (!out.restaurants.length || !out.menu.length) throw new Error("empty");
  return out;
}

async function load(){
  const c = store.get(CACHE_KEY);
  if (c && c.data && (Date.now() - c.at) < CONFIG.CACHE_MINUTES * 60000){ DATA = c.data; return; }
  try { DATA = await fetchAll(); store.set(CACHE_KEY, { at: Date.now(), data: DATA }); }
  catch(err){ if (c && c.data){ DATA = c.data; return; } throw err; }
}

/* =====================================================================
   THE FILTER CHAIN

   One predicate per relationship, used by the lists AND by the counts.
   Working a count out a second way is the classic source of "12 vendors"
   printed next to a list of three, so nothing here recounts anything.
   ===================================================================== */
const allZones = () => (DATA.zones || []).filter(live);
const allServices = () => (DATA.services || []).filter(live);
const allVendors = () => (DATA.restaurants || []).filter(live);
const allItems = () => (DATA.menu || []).filter(live);

const itemsOf = (vendorId) => allItems().filter(m => low(m.restaurant_id) === low(vendorId));

/* A vendor with nothing on its menu is a dead end, so it is never offered. */
const stocked = (v) => itemsOf(v.restaurant_id).length > 0;

const vendorZones = (v) => idList(v, "zone_id", "zone_ids");
const vendorServices = (v) => idList(v, "service_id", "service_ids");

/* A row that never says where it is or what it sells cannot be placed. Under
   STRICT_IDS it is held back instead of matching everything. */
const complete = (v) => !CONFIG.STRICT_IDS
  || (vendorZones(v).length > 0 && vendorServices(v).length > 0);
const wildZone = (v) => WILD(vendorZones(v));
const wildService = (v) => WILD(vendorServices(v));

const incomplete = () => allVendors().filter(v => stocked(v) && !complete(v));

const vendorsIn = (zoneId, serviceId) => allVendors().filter(v =>
  stocked(v) && complete(v)
  && (!zoneId || covers(vendorZones(v), zoneId))
  && (!serviceId || covers(vendorServices(v), serviceId)));

/* Only areas that can actually be served, and only services that actually have
   a stocked vendor in the chosen area. Every dead end is removed before the
   customer can walk into it. */
const zonesWithVendors = () => allZones().filter(z => vendorsIn(z.zone_id, null).length > 0);
const servicesIn = (zoneId) => allServices().filter(s => vendorsIn(zoneId, s.service_id).length > 0);

/* =====================================================================
   State
   ===================================================================== */
const S = { zone: null, service: null, vendor: null, packs: 1,
            qty: Object.create(null), cat: "", search: "", review: false };

const svcVal = (k, dflt) => { const v = norm(S.service && S.service[k]); return v === "" ? dflt : v; };
const hasPacks = () => low(svcVal("has_packs", "TRUE")) !== "false";
const itemWord = () => svcVal("item_label_plural", "items");
const vendorWord = () => svcVal("vendor_label", "vendor");
const packWord = (n) => n === 1 ? svcVal("pack_label", "pack")
                                : svcVal("pack_label_plural", svcVal("pack_label", "pack") + "s");
const packagingFee = () => cash(S.vendor && S.vendor.packaging_fee);

const lines = () => (S.vendor ? itemsOf(S.vendor.restaurant_id) : [])
  .filter(m => S.qty[m.item_id] > 0)
  .map(m => ({ id: m.item_id, name: m.item_name, price: cash(m.price), qty: S.qty[m.item_id] }));

const packs = () => hasPacks() ? Math.min(CONFIG.MAX_PACKS, Math.max(1, S.packs)) : 1;
const goods = () => lines().reduce((s, l) => s + l.price * l.qty, 0) * packs();
const packaging = () => packagingFee() * packs();
const shown = () => goods() + packaging();

/* =====================================================================
   Deep links and the URL

   A vendor can share their own menu, and each service card on the homepage
   can open the menu already filtered:
       /menu/?service=food
       /menu/?zone=ibereko&vendor=R001
   Anything that does not resolve is ignored rather than half-applied.
   ===================================================================== */
function applyUrl(){
  const p = new URLSearchParams(location.search);
  const pick = (rows, key, want) => rows.find(r => low(r[key]) === low(want)) || null;

  const z = p.get("zone"), sv = p.get("service"), vd = p.get("vendor");
  if (z) S.zone = pick(zonesWithVendors(), "zone_id", z);
  if (!S.zone){
    const saved = store.get(PREF_KEY);
    if (saved && saved.zone) S.zone = pick(zonesWithVendors(), "zone_id", saved.zone);
  }
  if (sv && S.zone) S.service = pick(servicesIn(S.zone.zone_id), "service_id", sv);
  if (vd && S.zone) S.vendor = pick(vendorsIn(S.zone.zone_id, S.service && S.service.service_id),
                                    "restaurant_id", vd);

  // A vendor named without a service: infer it, so the wording and the pack
  // rules are still right for that service.
  if (S.vendor && !S.service){
    const ids = vendorServices(S.vendor);
    if (ids.length === 1) S.service = allServices().find(s => low(s.service_id) === ids[0]) || null;
  }
}

function syncUrl(){
  const p = new URLSearchParams();
  if (S.zone) p.set("zone", S.zone.zone_id);
  if (S.service) p.set("service", S.service.service_id);
  if (S.vendor) p.set("vendor", S.vendor.restaurant_id);
  const dbg = new URLSearchParams(location.search).get("debug");
  if (dbg) p.set("debug", dbg);
  const q = p.toString();
  history.replaceState(null, "", q ? "?" + q : location.pathname);
  if (S.zone) store.set(PREF_KEY, { zone: S.zone.zone_id });
}

/* A basket survives an accidental reload, but only under the same vendor - a
   basket from another kitchen must never reappear under this one. */
const basketKey = () => "owa.basket." + low(S.vendor && S.vendor.restaurant_id);
const saveBasket = () => { if (S.vendor) store.set(basketKey(), { qty: S.qty, packs: S.packs, at: Date.now() }); };

function loadBasket(){
  if (!S.vendor) return;
  const b = store.get(basketKey());
  if (!b || (Date.now() - (b.at || 0)) > 6 * 3600 * 1000) return;   // stale after 6 hours
  const ids = new Set(itemsOf(S.vendor.restaurant_id).map(m => String(m.item_id)));
  const kept = Object.create(null);
  Object.keys(b.qty || {}).forEach(k => { if (ids.has(String(k))) kept[k] = b.qty[k]; });
  S.qty = kept;
  S.packs = Math.max(1, Math.min(CONFIG.MAX_PACKS, Number(b.packs) || 1));
}

/* =====================================================================
   Render
   ===================================================================== */
function render(){
  const body = $("mBody");
  body.innerHTML = "";
  syncUrl();
  renderRail();

  if (!S.zone) return stepZone(body);
  if (!S.service) return stepService(body);
  if (!S.vendor) return stepVendor(body);
  stepMenu(body);
  renderDocket();
}

function goto(patch){
  Object.assign(S, patch);
  render();
  window.scrollTo(0, 0);
}

/* The rail replaces the old breadcrumb. A breadcrumb only shows where you have
   been; this shows the whole four-step shape of an order at once, so the
   customer can see how much is left before they start. Completed steps stay
   tappable, which is how you go back and change your mind. */
const RAIL = [
  { key: "Area",   value: () => S.zone && (S.zone.zone_name || S.zone.zone_id),
    back: () => goto({ zone: null, service: null, vendor: null,
                       qty: Object.create(null), packs: 1, cat: "", search: "", review: false }) },
  { key: "Service", value: () => S.service && (S.service.service_name || S.service.service_id),
    back: () => goto({ service: null, vendor: null,
                       qty: Object.create(null), packs: 1, cat: "", search: "", review: false }) },
  { key: "Vendor",  value: () => S.vendor && (S.vendor.restaurant_name || S.vendor.restaurant_id),
    back: () => goto({ vendor: null, qty: Object.create(null), packs: 1,
                       cat: "", search: "", review: false }) },
  { key: "Items",   value: () => { const n = lines().reduce((s, l) => s + l.qty, 0);
                                   return n ? n + " added" : null; }, back: null }
];

function renderRail(){
  const rail = $("mRail");
  rail.innerHTML = "";
  rail.hidden = !S.zone;
  if (!S.zone) return;

  // The current step is the first one with nothing chosen yet.
  const values = RAIL.map(r => r.value());
  let current = values.findIndex(v => !v);
  if (current === -1) current = RAIL.length - 1;

  RAIL.forEach((r, i) => {
    const li = el("li");
    const state = values[i] ? (i === current ? "now" : "done") : (i === current ? "now" : "todo");
    li.dataset.state = state;

    const k = el("span", "m-rail-k", r.key);
    const v = el("span", "m-rail-v", values[i] || (i === current ? "Choose now" : "\u2014"));

    if (state === "done" && r.back){
      const b = el("button"); b.type = "button";
      b.setAttribute("aria-label", "Change " + r.key.toLowerCase() + ": " + values[i]);
      b.append(k, v);
      b.addEventListener("click", r.back);
      li.append(b);
    } else {
      const d = el("div", "m-rail-inner");
      if (state === "now") d.setAttribute("aria-current", "step");
      d.append(k, v);
      li.append(d);
    }
    rail.append(li);
  });

  // Four steps do not fit across a phone, so the rail scrolls. Bring the step
  // the customer is actually on into view rather than leaving them looking at
  // step one.
  const now = rail.querySelector('[data-state="now"]');
  if (now && rail.scrollWidth > rail.clientWidth){
    rail.scrollTo({ left: Math.max(0, now.offsetLeft - 16), behavior: "auto" });
  }
}

function chooser(host, heading, title, lede, options, empty){
  $("mDocket").hidden = true;
  const sec = el("section", "m-step");
  sec.append(el(heading, null, title));
  if (lede) sec.append(el("p", "m-lede", lede));

  if (!options.length){ sec.append(emptyState(empty)); host.append(sec); return; }

  const ul = el("ul", "m-choices");
  options.forEach(o => {
    const li = el("li");
    const b = el("button"); b.type = "button";
    const nm = el("span", "m-name");
    nm.append(document.createTextNode(o.name));
    if (o.sub) nm.append(el("span", "m-sub", o.sub));
    const go = el("span", "m-go", "\u203A"); go.setAttribute("aria-hidden", "true");
    b.append(nm, go);
    b.addEventListener("click", o.go);
    li.append(b); ul.append(li);
  });
  sec.append(ul);
  host.append(sec);
  if (WARN.length) host.append(diagnostics());
}

/* Ordering starts here, on the page, and only reaches WhatsApp once there is
   a real order to send. Where a customer needs a person rather than a basket -
   an area we do not cover yet, or a menu that will not load - they are sent to
   the contact page, not into an empty chat. */
function contactBtn(label, ghost){
  const a = el("a", "btn" + (ghost ? " btn-ghost" : ""), label || "Contact us");
  a.href = "/contact.html";
  return a;
}

function emptyState(text){
  const s = el("div", "m-state");
  s.append(el("h2", null, "Nothing here yet"));
  s.append(el("p", null, text || "Please try again shortly."));
  const acts = el("div", "m-acts");
  acts.append(contactBtn("Tell us where you are"));
  s.append(acts);

  // An empty list caused by unfinished sheet rows looks identical to an empty
  // list caused by having no vendors, and the two need completely different
  // fixes. The customer still sees the friendly message above; this says which
  // one it is, in the console and on ?debug=1, so it is never a guess.
  const bad = incomplete();
  if (bad.length){
    const msg = bad.length + " vendor row(s) are hidden because zone_id or "
      + "service_id is blank: " + bad.map(v => v.restaurant_id).join(", ")
      + ". Fill those columns in the Restaurants tab.";
    try { console.warn("[Owa menu] " + msg); } catch(e){}
    if (new URLSearchParams(location.search).get("debug")) s.append(el("p", "m-lede", msg));
  }
  return s;
}

function stepZone(host){
  chooser(host, "h1", "Where are we delivering?",
    "Pick the area closest to your house. It sets the flat delivery rate for your order.",
    zonesWithVendors().map(z => {
      const n = vendorsIn(z.zone_id, null).length;
      return { name: z.zone_name || z.zone_id,
               sub: n + (n === 1 ? " vendor" : " vendors") + " delivering here",
               go: () => goto({ zone: z, service: null, vendor: null }) };
    }),
    "No areas are open for online ordering yet. Tell us where you are and we will take your order directly.");
}

function stepService(host){
  const where = S.zone.zone_name || S.zone.zone_id;
  chooser(host, "h1", "What do you need?",
    "Only what is available in " + where + " right now.",
    servicesIn(S.zone.zone_id).map(s => {
      const n = vendorsIn(S.zone.zone_id, s.service_id).length;
      return { name: s.service_name || s.service_id,
               sub: norm(s.service_tagline) || (n + (n === 1 ? " vendor" : " vendors")),
               go: () => goto({ service: s, vendor: null }) };
    }),
    "Nothing is available in " + where + " for online ordering yet. Get in touch and we will sort it out.");
}

function stepVendor(host){
  const vs = vendorsIn(S.zone.zone_id, S.service.service_id);
  const where = S.zone.zone_name || S.zone.zone_id;
  chooser(host, "h1", "Choose a " + vendorWord(),
    vs.length + (vs.length === 1 ? " option" : " options") + " in " + where + ".",
    vs.map(v => {
      const items = itemsOf(v.restaurant_id);
      const cats = [...new Set(items.map(m => norm(m.category)).filter(Boolean))];
      const bits = [items.length + (items.length === 1 ? " item" : " items")];
      if (cats.length) bits.push(cats.slice(0, 3).join(" \u00b7 "));
      return { name: v.restaurant_name || v.restaurant_id,
               sub: bits.join("   \u2014   "),
               go: () => { S.vendor = v; S.qty = Object.create(null); S.packs = 1;
                           S.cat = ""; S.search = ""; S.review = false; loadBasket();
                           render(); window.scrollTo(0, 0); } };
    }),
    "No " + vendorWord() + " here is taking online orders at the moment.");
}

function stepMenu(host){
  const all = itemsOf(S.vendor.restaurant_id);
  const sec = el("section", "m-step");
  sec.append(el("h1", null, S.vendor.restaurant_name || S.vendor.restaurant_id));

  const meta = [];
  const addr = norm(S.vendor.restaurant_address) || norm(S.vendor.address);
  if (addr) meta.push(addr);
  if (packagingFee() > 0) meta.push("Packaging " + money(packagingFee()) + " per " + packWord(1));
  sec.append(el("p", "m-lede", meta.length ? meta.join("   \u00b7   ")
    : "Tap + to add. Your total updates as you go."));
  host.append(sec);

  const cats = [...new Set(all.map(m => norm(m.category)).filter(Boolean))];

  if (all.length > CONFIG.SEARCH_AFTER){
    const box = el("div", "m-search");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>';
    const inp = document.createElement("input");
    inp.type = "search"; inp.value = S.search;
    inp.placeholder = "Search this menu";
    inp.setAttribute("aria-label", "Search this menu");
    inp.addEventListener("input", () => { S.search = inp.value; drawPad(); });
    box.append(svg, inp);
    host.append(box);
  }

  // Section pills, each carrying its own count so the customer can see how big
  // a section is before opening it.
  if (cats.length > 1){
    const strip = el("div", "m-cats");
    strip.setAttribute("role", "group");
    strip.setAttribute("aria-label", "Menu sections");
    const countIn = (c) => c ? all.filter(m => norm(m.category) === c).length : all.length;
    [["", "All"], ...cats.map(c => [c, c])].forEach(([val, label]) => {
      const b = el("button"); b.type = "button";
      b.dataset.cat = val;
      b.append(document.createTextNode(label), el("span", "m-cats-n", String(countIn(val))));
      b.setAttribute("aria-pressed", String(S.cat === val));
      b.addEventListener("click", () => { S.cat = val; drawPad(); });
      strip.append(b);
    });
    host.append(strip);
  }

  const padHost = el("div"); padHost.id = "mPadHost";
  host.append(padHost);
  drawPad();

  if (WARN.length) host.append(diagnostics());
}

function visibleItems(){
  const q = low(S.search);
  return itemsOf(S.vendor.restaurant_id).filter(m => {
    if (S.cat && norm(m.category) !== S.cat) return false;
    if (!q) return true;
    return low(m.item_name).includes(q) || low(m.category).includes(q);
  });
}

function drawPad(){
  const host = $("mPadHost");
  if (!host) return;
  host.innerHTML = "";

  // Re-mark the section pills in place, so the strip does not jump under the thumb.
  const strip = document.querySelector(".m-cats");
  if (strip) [...strip.children].forEach(b =>
    b.setAttribute("aria-pressed", String((b.dataset.cat || "") === S.cat)));

  const rows = visibleItems();
  if (!rows.length){
    const s = el("div", "m-state");
    s.append(el("h2", null, "Nothing matches"));
    s.append(el("p", null, S.search ? "Try a different word, or clear the search."
                                    : "This section is empty at the moment."));
    host.append(s);
    renderDocket();
    return;
  }

  const groups = new Map();
  rows.forEach(m => {
    const k = norm(m.category) || "";
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(m);
  });

  groups.forEach((list, catName) => {
    if (catName && !S.cat){
      const h = el("h2", "m-cat-head");
      h.append(document.createTextNode(catName),
               el("span", "m-cat-n", list.length + (list.length === 1 ? " item" : " items")));
      host.append(h);
    }
    const ul = el("ul", "m-pad");
    list.forEach(m => ul.append(itemRow(m)));
    host.append(ul);
  });

  if (hasPacks()){
    const box = el("div", "m-packs");
    const txt = el("p");
    txt.append(el("strong", null, "How many " + packWord(2) + "?"));
    txt.append(document.createTextNode("The whole order above, repeated."
      + (packagingFee() > 0 ? " Packaging is charged per " + packWord(1) + "." : "")));
    box.append(txt, stepper({
      value: S.packs, min: 1, max: CONFIG.MAX_PACKS,
      lessLabel: "One fewer " + packWord(1), moreLabel: "One more " + packWord(1),
      change: (v) => { S.packs = v; saveBasket(); drawPad(); }
    }));
    host.append(box);
  }

  renderDocket();
}

function stepper({ value, min, max, lessLabel, moreLabel, change }){
  const st = el("div", "m-stepper");
  const less = el("button", "m-less", "\u2212"); less.type = "button";
  less.setAttribute("aria-label", lessLabel);
  less.disabled = value <= min;
  const q = el("span", "m-qty", String(value));
  q.dataset.zero = value === 0 ? "1" : "0";
  const more = el("button", "m-add", "+"); more.type = "button";
  more.setAttribute("aria-label", moreLabel);
  more.disabled = value >= max;
  less.addEventListener("click", () => change(Math.max(min, value - 1)));
  more.addEventListener("click", () => change(Math.min(max, value + 1)));
  st.append(less, q, more);
  return st;
}

function itemRow(m){
  const qty = S.qty[m.item_id] || 0;
  const li = el("li", "m-row" + (qty ? " m-in" : ""));
  li.dataset.item = m.item_id;

  const line = el("div", "m-line");
  const item = el("div", "m-item");
  item.append(el("span", "m-n", m.item_name || m.item_id));
  line.append(item, el("span", "m-leader"), el("span", "m-price", money(m.price)));

  li.append(line, stepper({
    value: qty, min: 0, max: CONFIG.MAX_QTY,
    lessLabel: "Remove one " + (m.item_name || "item"),
    moreLabel: "Add one " + (m.item_name || "item"),
    change: (v) => setQty(m, v)
  }));
  return li;
}

function setQty(m, v){
  // The bot accepts a fixed number of distinct lines. Stopping here is kinder
  // than letting the basket be silently trimmed after it has been sent.
  if (v > 0 && !S.qty[m.item_id] && lines().length >= CONFIG.MAX_LINES){
    alert("That is as many different items as one order can hold ("
      + CONFIG.MAX_LINES + "). Send this order, then start another.");
    return;
  }
  if (v === 0) delete S.qty[m.item_id]; else S.qty[m.item_id] = v;
  saveBasket();

  const rows = document.querySelectorAll(".m-row");
  for (const row of rows){
    if (row.dataset.item === String(m.item_id)){ row.replaceWith(itemRow(m)); break; }
  }
  renderRail();
  renderDocket(true);
}

function clearOrder(){
  S.qty = Object.create(null);
  S.packs = 1;
  S.review = false;
  saveBasket();
  drawPad();
  renderRail();
}

function renderDocket(animate){
  const d = $("mDocket");
  if (!S.vendor){ d.hidden = true; return; }
  d.hidden = false;

  const ls = lines();
  const n = ls.reduce((s, l) => s + l.qty, 0);

  const sum = $("mSum"); sum.innerHTML = "";
  if (ls.length){
    const add = (label, value) => {
      const r = el("div", "m-srow");
      r.append(el("span", null, label), el("b", null, money(value)));
      sum.append(r);
    };
    add(cap(itemWord()), goods());
    if (packaging() > 0) add("Packaging (" + packs() + " \u00d7 " + money(packagingFee()) + ")", packaging());
  }

  // Review panel: exactly what is about to be sent, line by line. Nothing here
  // feeds the message - it reads the same lines() the message does.
  const bar = $("mReviewBar"), list = $("mReview"), toggle = $("mReviewToggle");
  bar.hidden = ls.length === 0;
  if (!ls.length) S.review = false;
  toggle.setAttribute("aria-expanded", String(S.review));
  toggle.textContent = S.review ? "Hide items" : "Review items";
  list.hidden = !S.review;
  list.innerHTML = "";
  if (S.review){
    ls.forEach(l => {
      const li = el("li");
      li.append(el("span", "m-rq", l.qty + "\u00d7"),
                el("span", "m-rn", l.name),
                el("span", "m-rp", money(l.price * l.qty)));
      list.append(li);
    });
  }

  $("mCount").textContent = n
    ? n + " " + (n === 1 ? itemWord().replace(/s$/, "") : itemWord())
      + (hasPacks() && packs() > 1 ? "   \u00d7 " + packs() + " " + packWord(packs()) : "")
    : "Nothing yet";
  $("mNote").textContent = ls.length ? "Items and packaging so far"
                                     : "Delivery is a flat rate for your area";

  // Packaging is charged per pack, so shown() returns the packaging fee even
  // when the basket is empty - which read as "Nothing yet ... N200". The
  // money functions are left alone because the message builder uses them; only
  // what the customer is shown is guarded.
  const amt = $("mTotal");
  amt.textContent = money(ls.length ? shown() : 0);
  if (animate){ amt.classList.add("m-bump"); setTimeout(() => amt.classList.remove("m-bump"), 200); }

  const send = $("mSend"), label = $("mSendLabel");
  if (!ls.length){
    send.setAttribute("aria-disabled", "true");
    send.removeAttribute("href"); send.removeAttribute("target");
    label.textContent = "Add something first";
  } else {
    send.setAttribute("aria-disabled", "false");
    send.href = waLink();
    send.target = "_blank"; send.rel = "noopener";
    label.textContent = "Send this order on WhatsApp";
  }

  sizeDocket();
}

/* The docket is fixed to the bottom, so the page needs to reserve exactly as
   much room as the docket currently occupies - it grows when the review panel
   opens. Measuring beats guessing at a number that only holds on one phone. */
function sizeDocket(){
  const d = $("mDocket");
  if (!d || d.hidden) return;
  requestAnimationFrame(() => {
    const h = Math.round(d.getBoundingClientRect().height);
    if (h > 0) document.body.style.setProperty("--m-docket-h", h + "px");
  });
}

$("mReviewToggle").addEventListener("click", () => { S.review = !S.review; renderDocket(); });
$("mClear").addEventListener("click", clearOrder);
window.addEventListener("resize", sizeDocket);

/* =====================================================================
   The one message

   UNCHANGED. The bot parses the #OWA1 code at the end of this text, so the
   ids, the order of the fields and the separators must stay exactly as they
   are. Do not reformat this function.
   ===================================================================== */
function orderText(){
  const ls = lines();
  const p = packs();

  const out = [
    "\uD83D\uDED2 " + CONFIG.BUSINESS + " order",
    "",
    (S.vendor.restaurant_name || S.vendor.restaurant_id)
      + " \u2014 " + (S.zone.zone_name || S.zone.zone_id),
    ...ls.map(l => l.qty + " \u00d7 " + l.name)
  ];
  if (hasPacks() && p > 1) out.push("\uD83D\uDCE6 " + p + " " + packWord(p));
  out.push("");
  out.push(cap(itemWord()) + ": " + money(goods()));
  if (packaging() > 0) out.push("Packaging: " + money(packaging()));
  out.push("(service charge and delivery confirmed in the chat)", "", "");

  // Ids and quantities only. No prices: this is editable text, so the bot looks
  // every item up in the sheet and prices it there.
  const code = "#OWA1"
    + " s=" + (S.service ? S.service.service_id : "")
    + " z=" + S.zone.zone_id
    + " r=" + S.vendor.restaurant_id
    + " p=" + p
    + " i=" + ls.map(l => l.id + "*" + l.qty).join(",");

  return out.join("\n") + code;
}

const waLink = () => "https://wa.me/" + CONFIG.WA_NUMBER.replace(/\D/g, "")
  + "?text=" + encodeURIComponent(orderText());

/* =====================================================================
   Sheet check

   Visible only with ?debug=1, so a customer never sees it. It names the
   sheet problems that quietly make a menu look wrong - a vendor with no
   area, an item pointing at a vendor that is not there, a price that is not
   a number - which are far easier to fix when something points at them.
   ===================================================================== */
function audit(){
  WARN.length = 0;
  if (!new URLSearchParams(location.search).get("debug")) return;

  const zoneIds = new Set(allZones().map(z => low(z.zone_id)));
  const svcIds = new Set(allServices().map(s => low(s.service_id)));
  const vendIds = new Set(allVendors().map(v => low(v.restaurant_id)));
  const add = (title, ids) => { if (ids.length) WARN.push([title, ids]); };

  add(CONFIG.STRICT_IDS
      ? "Vendors HIDDEN because zone_id is blank - fill it in on the Restaurants tab"
      : "Vendors with a blank zone_id, so they appear in EVERY area",
    allVendors().filter(v => vendorZones(v).length === 0).map(v => v.restaurant_id));
  add(CONFIG.STRICT_IDS
      ? "Vendors HIDDEN because service_id is blank - fill it in on the Restaurants tab"
      : "Vendors with a blank service_id, so they appear under EVERY service",
    allVendors().filter(v => vendorServices(v).length === 0).map(v => v.restaurant_id));
  add("Vendors pointing at a zone that is not in the Zones tab",
    allVendors().filter(v => !wildZone(v) && vendorZones(v).some(z => !zoneIds.has(z)))
      .map(v => v.restaurant_id));
  add("Vendors pointing at a service that is not in the ServiceTypes tab",
    allVendors().filter(v => !wildService(v) && vendorServices(v).some(s => !svcIds.has(s)))
      .map(v => v.restaurant_id));
  add("Vendors covering EVERY area via '*' - correct only if they really do",
    allVendors().filter(wildZone).map(v => v.restaurant_id));
  add("Vendors hidden because they have no active menu items",
    allVendors().filter(v => !stocked(v)).map(v => v.restaurant_id));
  add("Items whose restaurant_id matches no active vendor",
    allItems().filter(m => !vendIds.has(low(m.restaurant_id))).map(m => m.item_id));
  add("Items with a missing or unreadable price",
    allItems().filter(m => cash(m.price) <= 0).map(m => m.item_id));

  const seen = new Set(), dupes = [];
  allItems().forEach(m => { const k = low(m.item_id);
    if (seen.has(k)) dupes.push(m.item_id); else seen.add(k); });
  add("Duplicate item_id values - only the first is reachable", dupes);
}

function diagnostics(){
  const box = el("div", "m-diag");
  box.append(el("h3", null, "Sheet check: " + WARN.length
    + (WARN.length === 1 ? " thing to look at" : " things to look at")));
  WARN.forEach(([title, ids]) => {
    box.append(el("p", null, title));
    const ul = el("ul");
    ids.slice(0, 25).forEach(i => { const li = el("li"); li.append(el("code", null, String(i))); ul.append(li); });
    if (ids.length > 25) ul.append(el("li", null, "\u2026and " + (ids.length - 25) + " more"));
    box.append(ul);
  });
  return box;
}

/* =====================================================================
   Boot
   ===================================================================== */
function failScreen(err){
  $("mDocket").hidden = true;
  $("mRail").hidden = true;
  const body = $("mBody"); body.innerHTML = "";
  const code = String((err && err.message) || "");
  const unset = code.startsWith("unset:");
  const empty = code === "empty";

  const s = el("div", "m-state");
  s.append(el("h2", null, unset ? "This menu is not connected yet"
    : empty ? "The menu is empty" : "The menu did not load"));
  s.append(el("p", null, unset
    ? "The sheet links at the top of this page still need filling in."
    : empty ? "No vendors or items came back from the sheet. Check that the Restaurants and MenuItems tabs are still published."
    : "Check your connection and try again. If it keeps failing, call us and we will take the order over the phone."));

  const acts = el("div", "m-acts");
  const again = el("button", "btn", "Try again");
  again.type = "button";
  again.addEventListener("click", boot);
  acts.append(again, contactBtn("Call us instead", true));
  s.append(acts);
  body.append(s);
}

async function boot(){
  const body = $("mBody");
  body.innerHTML = "";
  const wait = el("div", "m-state");
  wait.setAttribute("aria-busy", "true");
  wait.append(el("div", "m-skel"), el("div", "m-skel"), el("div", "m-skel"),
              el("p", null, "Loading today's menu\u2026"));
  body.append(wait);

  try{
    await load();
    audit();
    applyUrl();
    if (S.vendor) loadBasket();
    render();
  }catch(err){
    failScreen(err);
  }
}

window.addEventListener("popstate", () => {
  S.zone = S.service = S.vendor = null;
  S.qty = Object.create(null); S.packs = 1; S.cat = ""; S.search = ""; S.review = false;
  applyUrl();
  if (S.vendor) loadBasket();
  render();
});

boot();
</script>
<script src="/assets/site.js" defer></script>
